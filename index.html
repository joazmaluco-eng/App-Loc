<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <h1>Teste de Localização</h1>
    <button id="botaoPedir">Compartilhar minha localização</button>
    <p id="resultado"></p>

    <script>
        const webApp = window.Telegram.WebApp;
        webApp.ready();

        const BACKEND_URL = 'https://loc-backend-imrp.vercel.app/api/send-location';

        document.getElementById('botaoPedir').addEventListener('click', () => {
            const resultadoEl = document.getElementById('resultado');
            resultadoEl.innerText = 'Solicitando autorização...';

            if (!webApp.LocationManager) {
                resultadoEl.innerText = 'LocationManager não disponível.';
                return;
            }

            webApp.LocationManager.getLocation(async (dados) => {
                if (dados) {
                    const { latitude, longitude } = dados;

                    resultadoEl.innerHTML = `
                        Latitude: ${latitude} <br>
                        Longitude: ${longitude} <br>
                        <small>Enviando ao bot...</small>
                    `;

                    try {
                        const resposta = await fetch(BACKEND_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ latitude, longitude })
                        });

                        if (resposta.ok) {
                            resultadoEl.innerHTML += '<br>✅ Enviado com sucesso!';
                        } else {
                            resultadoEl.innerHTML += '<br>❌ Falha ao enviar.';
                        }
                    } catch (e) {
                        resultadoEl.innerHTML += '<br>❌ Erro: ' + e.message;
                    }
                } else {
                    resultadoEl.innerText = 'Autorização negada ou falha.';
                }
            });
        });
    </script>
</body>
</html>
